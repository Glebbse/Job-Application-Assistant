[project]
name = "job-app-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Glebbse",email = "pearsebrosnan7@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "openai (>=2.37.0,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "beautifulsoup4 (>=4.14.3,<5.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.13,<0.16.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "pytest (>=9.0.3,<10.0.0)"
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that call external APIs or services",
]